<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Sessions do work; GitHub holds the record</title>
  <desc id="desc">An ephemeral idea or chat becomes a durable GitHub issue. A local or agent execution session works from that issue and returns a pull request to GitHub. The pull request moves through review and current-head checks before landing. The diagram emphasizes that sessions and local work are disposable while GitHub artifacts are durable.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .ink { fill: #1f2937; }
      .muted { fill: #64748b; }
      .accent { fill: #0f766e; }
      .zone { fill: #ffffff; stroke: #0f766e; stroke-width: 1.5; }
      .ephemeral { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; stroke-dasharray: 6 6; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .focus { fill: #ecfeff; stroke: #0f766e; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .small { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; fill: #64748b; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="560" rx="16"/>
  <text class="mono" x="48" y="48">TRACER MENTAL MODEL</text>
  <text class="title" x="48" y="82">Sessions do work. GitHub holds the record.</text>

  <rect class="ephemeral" x="48" y="126" width="220" height="150" rx="12"/>
  <text class="mono" x="68" y="150">EPHEMERAL INPUT</text>
  <text class="label" x="68" y="186">Idea / chat / PRD</text>
  <text class="small" x="68" y="208">Useful context, not authority.</text>
  <text class="small" x="68" y="228">Safe to discard after intent</text>
  <text class="small" x="68" y="246">is captured durably.</text>

  <rect class="zone" x="316" y="126" width="756" height="252" rx="14"/>
  <rect x="340" y="116" width="208" height="20" class="bg"/>
  <text class="mono accent" x="348" y="130">DURABLE GITHUB COORDINATION</text>

  <rect class="focus" x="352" y="176" width="150" height="92" rx="10"/>
  <text class="label" x="372" y="205">Issue</text>
  <text class="small" x="372" y="226">Scoped intent</text>
  <text class="small" x="372" y="244">+ durable brief</text>

  <rect class="focus" x="590" y="176" width="150" height="92" rx="10"/>
  <text class="label" x="610" y="205">Pull request</text>
  <text class="small" x="610" y="226">Implementation</text>
  <text class="small" x="610" y="244">+ evidence bundle</text>

  <rect class="node" x="806" y="176" width="190" height="92" rx="10"/>
  <text class="label" x="826" y="205">Review + checks</text>
  <text class="small" x="826" y="226">Verdict bound to head SHA</text>
  <text class="small" x="826" y="244">Current-head gate</text>

  <rect class="node" x="806" y="302" width="190" height="48" rx="10"/>
  <text class="label" x="826" y="332">Landed change</text>

  <path class="line" d="M268 201 H352"/>
  <text class="mono" x="282" y="188">TO-ISSUES</text>

  <path class="line" d="M502 222 H590"/>
  <text class="mono" x="516" y="209">PR</text>

  <path class="line" d="M740 222 H806"/>
  <text class="mono" x="750" y="209">REVIEW-GATE</text>

  <path class="line" d="M901 268 V302"/>
  <text class="mono" x="912" y="289">GREEN</text>

  <rect class="ephemeral" x="352" y="418" width="388" height="94" rx="12"/>
  <text class="mono" x="372" y="442">EPHEMERAL WORKER / LOCAL STATE</text>
  <text class="label" x="372" y="469">Agent session + worktree</text>
  <text class="small" x="372" y="490">Executes the issue; commits and PR evidence return the result to GitHub.</text>

  <path class="line" d="M427 268 V374 Q427 386 439 386 H520 Q532 386 532 398 V418"/>
  <text class="mono" x="440" y="370">FROM-ISSUE</text>

  <path class="line" d="M650 418 V398 Q650 386 662 386 H665 Q677 386 677 374 V268"/>

  <text class="small" x="48" y="540">Durable artifacts survive session turnover; local narration does not.</text>
</svg>
