name: Gate Readiness

on:
  workflow_call:
    inputs:
      # workflow_call has no pull_request payload, so callers must provide the PR number explicitly.
      pr-number:
        description: PR number to evaluate.
        required: true
        type: number
      reviewer-logins:
        description: Comma-separated trusted review-gate GitHub logins; defaults to the caller repository variable.
        required: false
        type: string
      pull-request-action:
        description: Original pull_request action when invoked through a caller workflow.
        required: false
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  issues: write # issue comments + labels
  pull-requests: write # PR comment writeback; PR metadata is read-only via gh api
  checks: read # check-runs lookup
  statuses: read # commit statuses lookup

jobs:
  gate-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate readiness
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr-number }}
          INPUT_PULL_REQUEST_ACTION: ${{ github.event.action || inputs.pull-request-action }}
          REPOSITORY: ${{ github.repository }}
          TRACER_REVIEWER_LOGINS: ${{ inputs.reviewer-logins || vars.TRACER_REVIEWER_LOGINS }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request_target" ]; then
            pr_number="${PR_NUMBER:?}"
          else
            pr_number="${INPUT_PR_NUMBER:?}"
          fi
          repo="${REPOSITORY:?}"
          if [ -z "$(printf '%s' "${TRACER_REVIEWER_LOGINS:-}" | tr -d '[:space:],')" ]; then
            printf 'gate-readiness: TRACER_REVIEWER_LOGINS must contain at least one reviewer login\n' >&2
            exit 1
          fi
          marker='<!-- gate-readiness:bot -->'
          comment_marker='## gate-readiness'

          gh_api() {
            local diagnostic="$1"
            shift
            local stdout_file stderr_file status http_status

            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            if gh api "$@" >"$stdout_file" 2>"$stderr_file"; then
              cat "$stdout_file"
              rm -f "$stdout_file" "$stderr_file"
              return 0
            else
              status=$?
              http_status="$(grep -oE 'HTTP [0-9]{3}' "$stderr_file" | tail -n 1 | cut -d' ' -f2 || true)"
              if [ -n "$http_status" ]; then
                printf 'gate-readiness: gh api %s failed (http=%s, exit=%s)\n' "$diagnostic" "$http_status" "$status" >&2
              else
                printf 'gate-readiness: gh api %s failed (exit=%s)\n' "$diagnostic" "$status" >&2
              fi
              rm -f "$stdout_file" "$stderr_file"
              return "$status"
            fi
          }

          gh_api_capture() {
            local __result_var="$1"
            local diagnostic="$2"
            shift 2
            local stdout_file stderr_file status http_status payload

            stdout_file="$(mktemp)"
            stderr_file="$(mktemp)"

            if gh api "$@" >"$stdout_file" 2>"$stderr_file"; then
              payload="$(<"$stdout_file")"
              printf -v "$__result_var" '%s' "$payload"
              rm -f "$stdout_file" "$stderr_file"
              return 0
            else
              status=$?
              http_status="$(grep -oE 'HTTP [0-9]{3}' "$stderr_file" | tail -n 1 | cut -d' ' -f2 || true)"
              if [ -n "$http_status" ]; then
                printf 'gate-readiness: gh api %s failed (http=%s, exit=%s)\n' "$diagnostic" "$http_status" "$status" >&2
              else
                printf 'gate-readiness: gh api %s failed (exit=%s)\n' "$diagnostic" "$status" >&2
              fi
              rm -f "$stdout_file" "$stderr_file"
              return "$status"
            fi
          }

          pr_metadata_source="GitHub API"
          gh_token_source="secrets.GITHUB_TOKEN"
          pull_request_action="${INPUT_PULL_REQUEST_ACTION:-}"
          if ! gh_api_capture pr_metadata_json "GET repos/$repo/pulls/$pr_number" "repos/$repo/pulls/$pr_number"; then
            exit 1
          fi
          head_sha="$(printf '%s' "$pr_metadata_json" | jq -r '.head.sha')"
          pr_body="$(printf '%s' "$pr_metadata_json" | jq -r '.body // ""')"
          has_ready_label="$(printf '%s' "$pr_metadata_json" | jq -r '([(.labels // [])[] | .name] | index("gate:ready")) != null')"

          if [ "$pull_request_action" = "synchronize" ]; then
            if ! gh_api_capture sync_pr_json "GET repos/$repo/pulls/$pr_number (live head re-check for synchronize cleanup)" "repos/$repo/pulls/$pr_number"; then
              exit 1
            fi
            if [ "$(printf '%s' "$sync_pr_json" | jq -r '.head.sha // empty')" = "$head_sha" ]; then
              sync_gate_labels="$(printf '%s' "$sync_pr_json" | jq -r '[.labels // [] | .[] | .name | select(startswith("gate:"))] | .[] | @uri')"
              while IFS= read -r encoded_label; do
                [ -n "$encoded_label" ] || continue
                if ! gh_api_capture sync_pr_json "GET repos/$repo/pulls/$pr_number (recheck before synchronize label deletion)" "repos/$repo/pulls/$pr_number"; then
                  exit 1
                fi
                if [ "$(printf '%s' "$sync_pr_json" | jq -r '.head.sha // empty')" != "$head_sha" ]; then
                  printf 'gate-readiness: PR head moved during synchronize cleanup from %s; stopping label deletion\n' "$head_sha" >&2
                  break
                fi
                gh_api "DELETE repos/$repo/issues/$pr_number/labels/$encoded_label" -X DELETE "repos/$repo/issues/$pr_number/labels/$encoded_label" >/dev/null
              done <<< "$sync_gate_labels"
            else
              printf 'gate-readiness: PR head moved before synchronize cleanup; skipping label deletion\n' >&2
            fi
            exit 0
          fi

          closing_refs="$(printf '%s' "$pr_body" | jq -Rs -r '
            [scan("(?i)(?:Fixes|Closes|Resolves)[[:space:]]+(?:[A-Za-z0-9._-]+/[A-Za-z0-9._-]+)?#\\d+")]
            | if length == 0 then "none" else join(", ") end
          ')"
          has_closing_ref="false"
          if [ "$closing_refs" != "none" ]; then
            has_closing_ref="true"
          fi

          if ! gh_api_capture comments_json_raw "GET repos/$repo/issues/$pr_number/comments --paginate" "repos/$repo/issues/$pr_number/comments" --paginate; then
            exit 1
          fi
          comments_json="$(printf '%s' "$comments_json_raw" | jq -s 'add // []')"

          trusted_reviewers_json="$(printf '%s' "$TRACER_REVIEWER_LOGINS" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "") | ascii_downcase | select(length > 0))')"
          verdict_parse_result="$(printf '%s' "$comments_json" | jq -c --argjson reviewers "$trusted_reviewers_json" --arg pr_number "$pr_number" '
            def field_values($body; $field):
              [$body | scan("(?m)^" + $field + ":[ \\t]*[^\\n]*$")];
            def field_value($body; $field):
              try ($body | capture("(?m)^" + $field + ":[ \\t]*(?<value>[^\\n]*)$").value) catch null;
            def valid_next_action($verdict; $action; $head_sha):
              if $verdict == "needs-fix" then
                ($action | capture("^from-pr-review https://github\\.com/[^/\\s]+/[^/\\s]+/pull/(?<number>[0-9]+)$")? | .number == $pr_number)
              elif $verdict == "merge-candidate" then
                (($action | test("^gh pr ready " + $pr_number + "$")) or
                  ($action | test("^gh pr merge " + $pr_number + " --squash --match-head-commit " + $head_sha + "$")))
              elif $verdict == "needs-human" then
                $action == ("gh pr view " + $pr_number + " --web")
              else
                (($action == ("gh pr checks " + $pr_number)) or
                  ($action | test("^gh (api \\S+|pr view [0-9]+( --web)?|run view [0-9]+( --log)?|variable get \\S+( -R \\S+)?)$")))
              end;
            def parse_comment:
              . as $comment
              | $comment.body as $body
              | $comment.created_at as $created_at
              | try (
                  ($body | capture("^## review-gate:\\s*(?<verdict>\\S+)").verdict) as $verdict
                  | ($body | capture("(?m)^head-sha:[ \\t]*(?<head_sha>[0-9a-f]{40})[ \\t]*$").head_sha | ascii_downcase) as $head_sha
                  | ($body | capture("(?m)^review-round:[ \\t]*(?<review_round>[0-9]+)[ \\t]*$").review_round | tonumber) as $review_round
                  | ($body | capture("(?m)^reviewed-files:[ \\t]*(?<reviewed_files>[0-9]+)[ \\t]*$").reviewed_files | tonumber) as $reviewed_files
                  | field_values($body; "blocking-set") as $blocking_fields
                  | field_values($body; "next-action") as $next_action_fields
                  | field_value($body; "blocking-set") as $blocking_set
                  | field_value($body; "next-action") as $next_action
                  | (if $blocking_set == null or ($blocking_set | gsub("^\\s+|\\s+$"; "")) == "" then [] else ($blocking_set | split(",") | map(gsub("^\\s+|\\s+$"; ""))) end) as $blocking_targets
                  | if (["merge-candidate", "needs-fix", "needs-human", "blocked"] | index($verdict)) == null then null
                    elif ($blocking_fields | length) > 1 or ($next_action_fields | length) > 1 then null
                    elif ($blocking_fields | length) == 0 and $created_at >= "2026-09-01T12:23:47Z" then null
                    elif ($next_action_fields | length) == 0 and $created_at >= "2026-09-26T20:18:26Z" then null
                    elif ($blocking_targets | any(. == "")) then null
                    elif $verdict == "needs-fix" and ($blocking_targets | length) == 0 then null
                    elif (["merge-candidate", "needs-human"] | index($verdict)) != null and ($blocking_targets | length) > 0 then null
                    elif $next_action != null and (($next_action | gsub("^\\s+|\\s+$"; "")) == "" or (valid_next_action($verdict; ($next_action | gsub("^\\s+|\\s+$"; "")); $head_sha) | not)) then null
                    else {created_at: $created_at, verdict: $verdict, head_sha: $head_sha, review_round: $review_round, reviewed_files: $reviewed_files}
                    end
                ) catch null;
            [.[] | select(.body | startswith("## review-gate:"))] as $marked
            | [$marked[] | select((.user.login // "" | ascii_downcase) as $login | $reviewers | index($login) != null)] as $trusted
            | [$trusted[] | parse_comment | select(. != null)] | sort_by(.created_at) | last as $latest
            | {
                status: (if $latest != null then "valid" elif ($trusted | length) > 0 then "invalid" else "none" end),
                details: (if $latest == null then null else $latest | del(.created_at) end),
                ignoredAuthors: ([$marked[] | select((.user.login // "" | ascii_downcase) as $login | $reviewers | index($login) == null) | (.user.login // "unknown")] | unique | sort)
              }
          ')"
          ignored_reviewers="$(printf '%s' "$verdict_parse_result" | jq -r '(.ignoredAuthors // []) | join(", ")')"
          if [ -n "$ignored_reviewers" ]; then
            printf 'gate-readiness: ignored review-gate comments from non-allowlisted authors: %s\n' "$ignored_reviewers" >&2
          fi
          marker_parse_status="$(printf '%s' "$verdict_parse_result" | jq -r '.status')"
          review_gate_details="$(printf '%s' "$verdict_parse_result" | jq -c '.details // null')"

          review_gate_state="ungated"
          review_gate_verdict="none"
          review_gate_head_sha=""
          review_gate_round=""
          review_gate_files=""
          if [ "$review_gate_details" != "null" ]; then
            review_gate_verdict="$(printf '%s' "$review_gate_details" | jq -r '.verdict')"
            review_gate_head_sha="$(printf '%s' "$review_gate_details" | jq -r '.head_sha')"
            review_gate_round="$(printf '%s' "$review_gate_details" | jq -r '.review_round')"
            review_gate_files="$(printf '%s' "$review_gate_details" | jq -r '.reviewed_files')"
            if [ "$review_gate_head_sha" = "$head_sha" ]; then
              review_gate_state="current"
            else
              review_gate_state="stale"
            fi
          fi

          # Exact selection rule: ignore only GitHub Actions check-runs from this workflow job
          # (name: gate-readiness, app.slug: github-actions). They can be in-progress on the
          # active run or failed/successful on a stale rerun for the same SHA; all other checks
          # and all commit statuses for the head SHA still participate in readiness gating.
          if ! gh_api_capture check_runs_json_raw "GET repos/$repo/commits/$head_sha/check-runs --paginate" "repos/$repo/commits/$head_sha/check-runs" --paginate; then
            exit 1
          fi
          check_runs_json="$(printf '%s' "$check_runs_json_raw" | jq -s '[.[].check_runs[]?]')"
          signal_check_runs_json="$(printf '%s' "$check_runs_json" | jq -c '[.[] | select(.app.slug != "github-actions" or .name != "gate-readiness")]')"
          if ! gh_api_capture statuses_json_raw "GET repos/$repo/commits/$head_sha/statuses --paginate" "repos/$repo/commits/$head_sha/statuses" --paginate; then
            exit 1
          fi
          statuses_json="$(printf '%s' "$statuses_json_raw" | jq -s 'add // []')"
          current_check_runs_json="$(printf '%s' "$signal_check_runs_json" | jq -c '
            sort_by((.app.slug // ""), (.name // ""), (.run_number // 0), (.run_attempt // 0), (.run_started_at // .started_at // .created_at // ""), (.id // 0))
            | group_by([(.app.slug // ""), (.name // "")])
            | map(last)
          ')"
          current_statuses_json="$(printf '%s' "$statuses_json" | jq -c '
            sort_by(.context, .created_at)
            | group_by(.context)
            | map(last)
          ')"

          check_run_total="$(printf '%s' "$current_check_runs_json" | jq 'length')"
          check_run_completed="$(printf '%s' "$current_check_runs_json" | jq '[.[] | select(.status == "completed")] | length')"
          status_total="$(printf '%s' "$current_statuses_json" | jq 'length')"
          status_success="$(printf '%s' "$current_statuses_json" | jq '[.[] | select(.state == "success")] | length')"

          has_completable_signal="false"
          if [ "$check_run_completed" -gt 0 ] || [ "$status_total" -gt 0 ]; then
            has_completable_signal="true"
          fi

          failures=()
          if [ "$review_gate_state" != "current" ]; then
            if [ "$review_gate_state" = "stale" ]; then
              failures+=("review gate is stale (latest valid verdict head $review_gate_head_sha does not match current head $head_sha)")
            else
              failures+=("review gate is ungated (no valid review-gate verdict for current head $head_sha)")
            fi
          elif [ "$review_gate_verdict" != "merge-candidate" ]; then
            failures+=("current review gate verdict is $review_gate_verdict; only merge-candidate is ready")
          fi
          if [ "$has_closing_ref" != "true" ]; then
            failures+=("PR body has no closing reference; add a Fixes/Closes/Resolves reference to make readiness actionable")
          fi
          if [ "$has_completable_signal" != "true" ]; then
            failures+=("no completed check runs or commit statuses found for head $head_sha")
          fi

          while IFS= read -r line; do
            [ -n "$line" ] && failures+=("$line")
          done < <(printf '%s' "$current_check_runs_json" | jq -r '
            .[]
            | select(.status != "completed" or (.conclusion // "") != "success")
            | if .status != "completed" then
                "check run \((.name // .check_suite.app.slug // "unknown")) is \(.status)"
              else
                "check run \((.name // .check_suite.app.slug // "unknown")) completed with conclusion \((.conclusion // "none"))"
              end
          ')

          while IFS= read -r line; do
            [ -n "$line" ] && failures+=("$line")
          done < <(printf '%s' "$current_statuses_json" | jq -r '
            .[]
            | select(.state != "success")
            | "commit status \((.context // "unknown")) is \(.state)"
          ')

          ready="false"
          if [ "$review_gate_state" = "current" ] && [ "$has_completable_signal" = "true" ] && [ "${#failures[@]}" -eq 0 ]; then
            ready="true"
          fi

          comment_lines=(
            "$marker"
            "$comment_marker"
            ""
            "- PR: #$pr_number"
            "- head-sha: $head_sha"
            "- PR metadata source: $pr_metadata_source"
            "- auth path: GH_TOKEN -> $gh_token_source"
            "- review gate state: $review_gate_state"
            "- review gate verdict: $review_gate_verdict"
            "- latest marker parse: $marker_parse_status"
            "- ignored review-gate authors: ${ignored_reviewers:-none}"
          )
          if [ "$review_gate_details" != "null" ]; then
            comment_lines+=("- latest valid verdict: $review_gate_verdict (head-sha: $review_gate_head_sha, review-round: $review_gate_round, reviewed-files: $review_gate_files)")
          else
            comment_lines+=("- latest valid verdict: none")
          fi
          comment_lines+=(
            "- closing refs: $closing_refs"
            "- check runs: $check_run_completed/$check_run_total completed"
            "- commit statuses: $status_success/$status_total successful"
            "- readiness: $ready"
            ""
            "### Failed readiness conditions"
          )

          if [ "${#failures[@]}" -eq 0 ]; then
            comment_lines+=("- none")
          else
            for failure in "${failures[@]}"; do
              comment_lines+=("- $failure")
            done
          fi

          # Re-read the live PR immediately before any write. Event payloads and earlier reads can
          # describe a head that has since been replaced; writing labels or the readiness comment
          # for a superseded head would restore stale state. A newer run evaluates the new head.
          if ! gh_api_capture live_pr_json "GET repos/$repo/pulls/$pr_number (live head re-check)" "repos/$repo/pulls/$pr_number"; then
            exit 1
          fi
          live_head_sha="$(printf '%s' "$live_pr_json" | jq -r '.head.sha // empty')"
          if [ "$live_head_sha" != "$head_sha" ]; then
            printf 'gate-readiness: PR head moved from %s to %s during evaluation; skipping comment and label writes\n' "$head_sha" "${live_head_sha:-unknown}" >&2
            exit 0
          fi
          has_ready_label="$(printf '%s' "$live_pr_json" | jq -r '([(.labels // [])[] | .name] | index("gate:ready")) != null')"

          comment_body="$(printf '%s\n' "${comment_lines[@]}")"
          existing_comment_id="$(printf '%s' "$comments_json" | jq -r --arg marker "$marker" '
            [ .[] | select(.body | contains($marker)) | {id, created_at} ]
            | sort_by(.created_at)
            | last
            | .id // empty
          ')"

          if [ -n "$existing_comment_id" ]; then
            gh_api "PATCH repos/$repo/issues/comments/$existing_comment_id" -X PATCH "repos/$repo/issues/comments/$existing_comment_id" -f body="$comment_body" >/dev/null
          else
            gh_api "POST repos/$repo/issues/$pr_number/comments" -X POST "repos/$repo/issues/$pr_number/comments" -f body="$comment_body" >/dev/null
          fi

          pr_label_json="$(printf '%s' "$live_pr_json" | jq -c '[.labels // [] | .[] | .name]')"
          verdict_label=""
          if [ "$review_gate_state" = "current" ]; then
            case "$review_gate_verdict" in
              merge-candidate) verdict_label="gate:merge-candidate" ;;
              needs-fix) verdict_label="gate:needs-fix" ;;
              needs-human) verdict_label="gate:needs-human" ;;
              blocked) verdict_label="gate:blocked" ;;
            esac
          fi
          existing_verdict_labels="$pr_label_json"
          while IFS='|' read -r label color description; do
            if ! gh api "repos/$repo/labels/$label" >/dev/null 2>&1; then
              if ! create_error="$(gh api -X POST "repos/$repo/labels" -f name="$label" -f color="$color" -f description="$description" 2>&1 >/dev/null)"; then
                if [[ "$create_error" != *"already_exists"* && "$create_error" != *"HTTP 422"* ]]; then
                  printf 'gate-readiness: failed to create label %s: %s\n' "$label" "$create_error" >&2
                  exit 1
                fi
              fi
            fi
            if [ "$label" = "$verdict_label" ]; then
              gh_api "POST repos/$repo/issues/$pr_number/labels" -X POST "repos/$repo/issues/$pr_number/labels" -f labels[]="$label" >/dev/null
            elif printf '%s' "$existing_verdict_labels" | jq -e --arg label "$label" 'index($label) != null' >/dev/null; then
              gh_api "DELETE repos/$repo/issues/$pr_number/labels/$label" -X DELETE "repos/$repo/issues/$pr_number/labels/$label" >/dev/null || true
            fi
          done <<'LABELS'
          gate:merge-candidate|0e8a16|Trusted current-head merge-candidate verdict
          gate:needs-fix|d93f0b|Trusted current-head needs-fix verdict
          gate:needs-human|fbca04|Trusted current-head needs-human verdict
          gate:blocked|b60205|Trusted current-head blocked verdict
          LABELS

          if [ "$ready" = "true" ]; then
            if [ "$has_ready_label" != "true" ]; then
              gh_api "POST repos/$repo/issues/$pr_number/labels" -X POST "repos/$repo/issues/$pr_number/labels" -f labels[]="gate:ready" >/dev/null
            fi
          else
            if [ "$has_ready_label" = "true" ]; then
              gh_api "DELETE repos/$repo/issues/$pr_number/labels/gate:ready" -X DELETE "repos/$repo/issues/$pr_number/labels/gate:ready" >/dev/null || true
            fi
          fi
