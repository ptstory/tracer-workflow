name: Gate Readiness Reevaluate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  resolve-ci-pr:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.resolve.outputs.pr-number }}
    steps:
      - id: resolve
        name: Resolve PR for completed CI run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail

          pr_number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$EVENT_PATH")"
          if [ -z "$pr_number" ]; then
            head_sha="$(jq -r '.workflow_run.head_sha // empty' "$EVENT_PATH")"
            if [ -n "$head_sha" ]; then
              pr_number="$(
                gh api "repos/$REPOSITORY/commits/$head_sha/pulls" \
                  --jq '[.[] | select(.state == "open")] | sort_by(.number) | first | .number // empty'
              )"
            fi
          fi

          printf 'pr-number=%s\n' "$pr_number" >> "$GITHUB_OUTPUT"

  after-ci:
    needs: resolve-ci-pr
    if: needs.resolve-ci-pr.outputs.pr-number != ''
    uses: ./.github/workflows/gate-readiness.yml
    with:
      pr-number: ${{ fromJSON(needs.resolve-ci-pr.outputs.pr-number) }}
    secrets: inherit

  after-review-gate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '## review-gate:')
    uses: ./.github/workflows/gate-readiness.yml
    with:
      pr-number: ${{ github.event.issue.number }}
    secrets: inherit
