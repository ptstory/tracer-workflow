name: Dependency Readiness

on:
  issues:
    types: [opened, edited, labeled, closed, reopened]
  pull_request_target:
    types: [closed, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: dependency-readiness-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Reconcile issue dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: bun tooling/dependency-readiness/dependency-readiness.ts
