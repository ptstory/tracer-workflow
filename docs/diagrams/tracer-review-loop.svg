<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">A review verdict is valid only for the reviewed pull request head</title>
  <desc id="desc">Review-gate reviews the current pull request head and posts a verdict stamped with that SHA. A needs-fix verdict goes through from-pr-review and a push. The push creates a new head SHA, making every prior verdict stale, so a fresh review is required. If the current-head gate is green, AFK work may land autonomously while HITL work requires the human to merge.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .ink { fill: #1f2937; }
      .muted { fill: #64748b; }
      .accentText { fill: #0f766e; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .focus { fill: #ecfeff; stroke: #0f766e; stroke-width: 1.5; }
      .stale { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.5; }
      .stop { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.2; stroke-dasharray: 5 5; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.5; marker-end: url(#arrow); }
      .return { fill: none; stroke: #0f766e; stroke-width: 1.6; marker-end: url(#arrow); }
      .label { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
      .small { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .mono { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; fill: #64748b; }
      .title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2937; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="650" rx="16"/>
  <text class="mono" x="48" y="48">PR REVIEW LOOP</text>
  <text class="title" x="48" y="82">A verdict is valid only for the reviewed head.</text>

  <rect class="focus" x="62" y="156" width="168" height="88" rx="10"/>
  <text class="label" x="82" y="185">PR head</text>
  <text class="small" x="82" y="207">SHA A</text>
  <text class="small" x="82" y="225">current head</text>

  <rect class="node" x="300" y="156" width="168" height="88" rx="10"/>
  <text class="label" x="320" y="185">review-gate</text>
  <text class="small" x="320" y="207">Fresh review</text>
  <text class="small" x="320" y="225">of current head</text>

  <rect class="focus" x="538" y="156" width="190" height="88" rx="10"/>
  <text class="label" x="558" y="185">Verdict @ SHA A</text>
  <text class="small" x="558" y="207">Valid only while</text>
  <text class="small" x="558" y="225">head == SHA A</text>

  <rect class="node" x="798" y="126" width="244" height="104" rx="10"/>
  <text class="label" x="818" y="155">Current-head gate green</text>
  <text class="small" x="818" y="177">No blocking findings;</text>
  <text class="small" x="818" y="195">current-head check evidence</text>
  <text class="small" x="818" y="213">satisfies repository policy.</text>

  <path class="line" d="M230 200 H300"/>
  <path class="line" d="M468 200 H538"/>
  <path class="line" d="M728 188 H798"/>

  <rect class="node" x="798" y="268" width="116" height="72" rx="10"/>
  <text class="label" x="818" y="297">AFK</text>
  <text class="small" x="818" y="318">May land</text>

  <rect class="node" x="926" y="268" width="116" height="72" rx="10"/>
  <text class="label" x="946" y="297">HITL</text>
  <text class="small" x="946" y="318">Human merge</text>

  <path class="line" d="M856 230 V268"/>
  <path class="line" d="M984 230 V268"/>

  <rect class="node" x="538" y="328" width="190" height="84" rx="10"/>
  <text class="label" x="558" y="357">from-pr-review</text>
  <text class="small" x="558" y="379">Apply fix-now findings</text>
  <text class="small" x="558" y="397">and verify locally</text>

  <path class="line" d="M633 244 V328"/>
  <text class="mono" x="646" y="290">NEEDS-FIX</text>

  <rect class="node" x="300" y="328" width="168" height="84" rx="10"/>
  <text class="label" x="320" y="357">Push fix</text>
  <text class="small" x="320" y="379">New commit</text>
  <text class="small" x="320" y="397">moves PR head</text>

  <path class="line" d="M538 370 H468"/>

  <rect class="focus" x="62" y="328" width="168" height="84" rx="10"/>
  <text class="label" x="82" y="357">PR head</text>
  <text class="small" x="82" y="379">SHA B</text>
  <text class="small" x="82" y="397">new current head</text>

  <path class="line" d="M300 370 H230"/>

  <rect class="stale" x="62" y="468" width="406" height="92" rx="10"/>
  <text class="label" x="82" y="498">Prior verdict is stale immediately</text>
  <text class="small" x="82" y="520">Verdict says SHA A; current head is SHA B.</text>
  <text class="small" x="82" y="540">Readers treat that as no valid verdict.</text>

  <path class="line" d="M146 412 V468"/>

  <path class="return" d="M468 514 H760 Q772 514 772 502 V284 Q772 272 760 272 H384 Q372 272 372 260 V244"/>
  <rect x="520" y="500" width="170" height="20" class="bg"/>
  <text class="mono accentText" x="530" y="514">FRESH REVIEW REQUIRED</text>

  <rect class="stop" x="798" y="388" width="244" height="88" rx="10"/>
  <text class="label" x="818" y="417">Other verdict states stop</text>
  <text class="small" x="818" y="439">needs-human / blocked</text>
  <text class="small" x="818" y="457">No automatic fix pass.</text>

  <text class="small" x="48" y="620">Any push changes the head SHA and voids all earlier verdicts, regardless of who pushed.</text>
</svg>
